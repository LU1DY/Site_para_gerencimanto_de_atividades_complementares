<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Modal – Análise do Evento</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet" />
		<link
			rel="stylesheet"
			href="../css/components/modal-analise-evento.css" />
	</head>
	<body>
		<div class="modal">
			<header class="modal-header">
				<div class="modal-header-text">
					<h2>Análise do Evento</h2>
					<p>Estatísticas de inscrições e informações detalhadas.</p>
				</div>
				<button class="btn-fechar" type="button" aria-label="Fechar">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						viewBox="0 0 24 24"
						fill="none"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round">
						<path d="M18 6 6 18M6 6l12 12" />
					</svg>
				</button>
			</header>

			<div class="evento-card">
				<span class="evento-nome"
					>Seminário de Inteligência Artificial</span
				>
				<div class="evento-meta-row">
					<span class="evento-meta-item">
						<svg
							xmlns="http://www.w3.org/2000/svg"
							viewBox="0 0 24 24"
							fill="none"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round">
							<rect x="3" y="4" width="18" height="18" rx="2" />
							<path d="M8 2v4M16 2v4M3 10h18" />
						</svg>
						09/04/2026
					</span>
					<span class="evento-meta-item">
						<svg
							xmlns="http://www.w3.org/2000/svg"
							viewBox="0 0 24 24"
							fill="none"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round">
							<path
								d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" />
							<circle cx="12" cy="10" r="3" />
						</svg>
						Auditório Central
					</span>
					<span class="evento-meta-item">
						<svg
							xmlns="http://www.w3.org/2000/svg"
							viewBox="0 0 24 24"
							fill="none"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round">
							<path
								d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
							<path
								d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
						</svg>
						Seminário
					</span>
					<span class="evento-meta-item">
						<svg
							xmlns="http://www.w3.org/2000/svg"
							viewBox="0 0 24 24"
							fill="none"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round">
							<circle cx="12" cy="12" r="10" />
							<polyline points="12 6 12 12 16 14" />
						</svg>
						4h · presencial
					</span>
				</div>
				<p class="evento-descricao">
					Palestra sobre os avanços recentes em IA generativa.
				</p>
			</div>

			<div class="stats-grid">
				<div class="stat-card">
					<span class="stat-label">
						<svg
							xmlns="http://www.w3.org/2000/svg"
							viewBox="0 0 24 24"
							fill="none"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round">
							<path
								d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
							<circle cx="9" cy="7" r="4" />
							<path d="M22 21v-2a4 4 0 0 0-3-3.87" />
							<path d="M16 3.13a4 4 0 0 1 0 7.75" />
						</svg>
						Inscritos
					</span>
					<span class="stat-valor">33</span>
				</div>
				<div class="stat-card">
					<span class="stat-label">
						<svg
							xmlns="http://www.w3.org/2000/svg"
							viewBox="0 0 24 24"
							fill="none"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round">
							<circle cx="12" cy="12" r="10" />
							<path d="m9 12 2 2 4-4" />
						</svg>
						Confirmados
					</span>
					<span class="stat-valor">23</span>
				</div>
				<div class="stat-card">
					<span class="stat-label">
						<svg
							xmlns="http://www.w3.org/2000/svg"
							viewBox="0 0 24 24"
							fill="none"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round">
							<polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
							<polyline points="16 7 22 7 22 13" />
						</svg>
						Presentes
					</span>
					<span class="stat-valor">0</span>
				</div>
			</div>

			<div class="ocupacao-wrapper">
				<div class="ocupacao-header">
					<span class="ocupacao-label">Ocupação</span>
					<span class="ocupacao-valor">33/100</span>
				</div>
				<div class="progress-track">
					<div class="progress-fill" style="width: 33%"></div>
				</div>
			</div>

			<footer class="modal-footer">
				<button class="btn-fechar-footer" type="button">Fechar</button>
				<button class="btn-editar" type="button">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						viewBox="0 0 24 24"
						fill="none"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round">
						<path
							d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
					</svg>
					Editar evento
				</button>
			</footer>
		</div>
	</body>
</html>
