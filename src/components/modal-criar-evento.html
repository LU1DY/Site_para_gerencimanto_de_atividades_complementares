<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Modal – Editar Evento</title>
		<link
			rel="stylesheet"
			href="../css/components/modal-editar_criar-evento.css" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet" />
	</head>
	<body>
		<div class="modal">
			<header class="modal-header">
				<div>
					<h2>Novo Evento</h2>
					<p>Atualize as informações do evento.</p>
				</div>
				<button class="btn-fechar" type="button" aria-label="Fechar">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						viewBox="0 0 24 24"
						fill="none"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round">
						<path d="M18 6 6 18M6 6l12 12" />
					</svg>
				</button>
			</header>

			<div class="modal-body">
				<div class="form-group">
					<label class="form-label" for="titulo"
						>Título do evento</label
					>
					<input
						class="form-input"
						type="text"
						id="titulo"
						value="Seminário de Inteligência Artificial" />
				</div>

				<div class="form-row form-row-2">
					<div class="form-group">
						<label class="form-label" for="tipo">Tipo</label>
						<input
							class="form-input"
							type="text"
							id="tipo"
							value="Seminário" />
					</div>
					<div class="form-group">
						<label class="form-label" for="situacao"
							>Situação</label
						>
						<div class="select-wrapper">
							<select class="form-select" id="situacao">
								<option selected>Aberto</option>
								<option>Encerrado</option>
								<option>Cancelado</option>
							</select>
							<svg
								xmlns="http://www.w3.org/2000/svg"
								viewBox="0 0 24 24"
								fill="none"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round">
								<path d="m6 9 6 6 6-6" />
							</svg>
						</div>
					</div>
				</div>

				<div class="form-row form-row-3">
					<div class="form-group">
						<label class="form-label" for="data">Data</label>
						<div class="input-wrapper">
							<input
								class="form-input"
								type="text"
								id="data"
								value="10/04/2026" />
							<span class="input-icon-right">
								<svg
									xmlns="http://www.w3.org/2000/svg"
									viewBox="0 0 24 24"
									fill="none"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round">
									<rect
										x="3"
										y="4"
										width="18"
										height="18"
										rx="2" />
									<path d="M8 2v4M16 2v4M3 10h18" />
								</svg>
							</span>
						</div>
					</div>
					<div class="form-group">
						<label class="form-label" for="carga">Carga (h)</label>
						<input
							class="form-input"
							type="number"
							id="carga"
							value="4"
							min="1" />
					</div>
					<div class="form-group">
						<label class="form-label" for="modalidade"
							>Modalidade</label
						>
						<div class="select-wrapper">
							<select class="form-select" id="modalidade">
								<option selected>Presencial</option>
								<option>Online</option>
								<option>Híbrido</option>
							</select>
							<svg
								xmlns="http://www.w3.org/2000/svg"
								viewBox="0 0 24 24"
								fill="none"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round">
								<path d="m6 9 6 6 6-6" />
							</svg>
						</div>
					</div>
				</div>

				<div class="form-group">
					<label class="form-label" for="local">Local</label>
					<input
						class="form-input"
						type="text"
						id="local"
						value="Auditório Central" />
				</div>

				<div class="form-group">
					<label class="form-label" for="descricao">Descrição</label>
					<div class="textarea-wrapper">
						<textarea
							class="form-textarea"
							id="descricao"
							maxlength="500">
Palestra sobre os avanços recentes em IA generativa.</textarea
						>
						<span class="textarea-contador" id="contador"
							>52/500</span
						>
					</div>
				</div>
			</div>

			<footer class="modal-footer">
				<button class="btn-fechar-footer" type="button">Fechar</button>
				<button class="btn-salvar" type="button">
					Cadastrar evento
				</button>
			</footer>
		</div>
	</body>
</html>
