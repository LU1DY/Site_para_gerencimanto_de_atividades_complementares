<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modal – Editar Evento</title>
    <link rel="stylesheet" href="../css/config/global-config.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ════════════════════════════
       OVERLAY
    ════════════════════════════ */

      .modal-overlay {
        position: fixed;
        inset: 0;
        background-color: #17212680;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.4rem;
        z-index: 100;
      }

      /* ════════════════════════════
       CARD DO MODAL
    ════════════════════════════ */

      .modal {
        background-color: var(--color-background-white);
        border: 1px solid var(--border-color-1);
        border-radius: var(--border-radius-2);
        box-shadow: 0 8px 32px #17212624;
        width: 100%;
        max-width: 44rem;
        display: flex;
        flex-direction: column;
      }

      /* ─── Cabeçalho ─── */

      .modal-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1.6rem;
        padding: 2.4rem 2.4rem 2rem;
        border-bottom: 1px solid var(--border-color-1);
      }

      .modal-header h2 {
        font-size: var(--font-size-18px);
        font-weight: var(--font-weight-bold);
        color: var(--color-title);
        margin-bottom: 0.4rem;
      }

      .modal-header p {
        font-size: var(--font-size-14px);
        color: var(--color-description);
      }

      .btn-fechar {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 3.2rem;
        height: 3.2rem;
        flex-shrink: 0;
        background: none;
        border: none;
        border-radius: var(--border-radius);
        cursor: pointer;
        transition: background-color 0.15s;
      }

      .btn-fechar:hover {
        background-color: var(--details-2);
      }

      .btn-fechar svg {
        width: 1.8rem;
        height: 1.8rem;
        stroke: var(--color-description);
      }

      /* ─── Corpo com scroll ─── */

      .modal-body {
        padding: 2rem 2.4rem;
        display: flex;
        flex-direction: column;
        gap: 1.6rem;
        overflow-y: auto;
        max-height: calc(100vh - 18rem);
        scrollbar-width: thin;
        scrollbar-color: var(--border-color-1) transparent;
      }

      /* ─── Grupos de campo ─── */

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }

      .form-row {
        display: grid;
        gap: 1.2rem;
      }

      .form-row-2 {
        grid-template-columns: 1fr 1fr;
      }
      .form-row-3 {
        grid-template-columns: 1fr 1fr 1fr;
      }

      .form-label {
        font-size: var(--font-size-14px);
        font-weight: var(--font-weight-medium);
        color: var(--color-title);
      }

      /* ─── Inputs ─── */

      .form-input,
      .form-select,
      .form-textarea {
        width: 100%;
        font-family: var(--font-family-primary);
        font-size: var(--font-size-14px);
        color: var(--color-title);
        background-color: var(--color-background-white);
        border: 1px solid var(--border-color-1);
        border-radius: var(--border-radius);
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }

      .form-input,
      .form-select {
        padding: 1.1rem 1.4rem;
      }

      .form-input::placeholder,
      .form-textarea::placeholder {
        color: var(--color-description);
      }

      .form-input:focus,
      .form-select:focus,
      .form-textarea:focus {
        border-color: var(--color-icons-green-1);
        box-shadow: 0 0 0 3px #1b746b18;
      }

      /* Input com ícone à direita (data) */
      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-wrapper .form-input {
        padding-right: 3.6rem;
      }

      .input-icon-right {
        position: absolute;
        right: 1.2rem;
        display: flex;
        align-items: center;
        pointer-events: none;
      }

      .input-icon-right svg {
        width: 1.6rem;
        height: 1.6rem;
        stroke: var(--color-description);
      }

      /* Select com seta customizada */
      .select-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .select-wrapper svg {
        position: absolute;
        right: 1.2rem;
        width: 1.6rem;
        height: 1.6rem;
        stroke: var(--color-description);
        pointer-events: none;
      }

      .form-select {
        appearance: none;
        -webkit-appearance: none;
        padding-right: 3.6rem;
        cursor: pointer;
      }

      /* Textarea */
      .form-textarea {
        padding: 1.1rem 1.4rem;
        padding-bottom: 2.8rem;
        resize: vertical;
        min-height: 10rem;
        line-height: 1.5;
      }

      .textarea-wrapper {
        position: relative;
      }

      .textarea-contador {
        position: absolute;
        bottom: 1rem;
        right: 1.2rem;
        font-size: var(--font-size-12px);
        color: var(--color-description);
        pointer-events: none;
      }

      /* ─── Rodapé ─── */

      .modal-footer {
        display: flex;
        align-items: center;
        gap: 1.2rem;
        padding: 1.6rem 2.4rem;
        border-top: 1px solid var(--border-color-1);
      }

      .btn-fechar-footer {
        padding: 1rem 2rem;
        background-color: transparent;
        border: 1px solid var(--border-color-1);
        border-radius: var(--border-radius);
        font-family: var(--font-family-primary);
        font-size: var(--font-size-14px);
        font-weight: var(--font-weight-semibold);
        color: var(--color-title);
        cursor: pointer;
        transition: background-color 0.15s;
      }

      .btn-fechar-footer:hover {
        background-color: var(--color-background-main);
      }

      .btn-salvar {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        padding: 1rem 2rem;
        background-color: var(--color-icons-green-1);
        border: none;
        border-radius: var(--border-radius);
        font-family: var(--font-family-primary);
        font-size: var(--font-size-14px);
        font-weight: var(--font-weight-semibold);
        color: #ffffff;
        cursor: pointer;
        transition:
          background-color 0.15s,
          transform 0.1s;
      }

      .btn-salvar:hover {
        background-color: var(--color-background-navbar);
      }
      .btn-salvar:active {
        transform: scale(0.98);
      }

      .btn-salvar svg {
        width: 1.6rem;
        height: 1.6rem;
        stroke: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="modal-overlay">
      <div class="modal">
        <!-- Cabeçalho -->
        <header class="modal-header">
          <div>
            <h2>Editar Evento</h2>
            <p>Atualize as informações do evento.</p>
          </div>
          <button class="btn-fechar" type="button" aria-label="Fechar">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </header>

        <!-- Formulário -->
        <div class="modal-body">
          <!-- Título -->
          <div class="form-group">
            <label class="form-label" for="titulo">Título do evento</label>
            <input
              class="form-input"
              type="text"
              id="titulo"
              value="Seminário de Inteligência Artificial"
            />
          </div>

          <!-- Tipo + Situação -->
          <div class="form-row form-row-2">
            <div class="form-group">
              <label class="form-label" for="tipo">Tipo</label>
              <input
                class="form-input"
                type="text"
                id="tipo"
                value="Seminário"
              />
            </div>
            <div class="form-group">
              <label class="form-label" for="situacao">Situação</label>
              <div class="select-wrapper">
                <select class="form-select" id="situacao">
                  <option selected>Aberto</option>
                  <option>Encerrado</option>
                  <option>Cancelado</option>
                </select>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m6 9 6 6 6-6" />
                </svg>
              </div>
            </div>
          </div>

          <!-- Data + Carga + Modalidade -->
          <div class="form-row form-row-3">
            <div class="form-group">
              <label class="form-label" for="data">Data</label>
              <div class="input-wrapper">
                <input
                  class="form-input"
                  type="text"
                  id="data"
                  value="10/04/2026"
                />
                <span class="input-icon-right">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect x="3" y="4" width="18" height="18" rx="2" />
                    <path d="M8 2v4M16 2v4M3 10h18" />
                  </svg>
                </span>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="carga">Carga (h)</label>
              <input
                class="form-input"
                type="number"
                id="carga"
                value="4"
                min="1"
              />
            </div>
            <div class="form-group">
              <label class="form-label" for="modalidade">Modalidade</label>
              <div class="select-wrapper">
                <select class="form-select" id="modalidade">
                  <option selected>Presencial</option>
                  <option>Online</option>
                  <option>Híbrido</option>
                </select>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m6 9 6 6 6-6" />
                </svg>
              </div>
            </div>
          </div>

          <!-- Local -->
          <div class="form-group">
            <label class="form-label" for="local">Local</label>
            <input
              class="form-input"
              type="text"
              id="local"
              value="Auditório Central"
            />
          </div>

          <!-- Descrição -->
          <div class="form-group">
            <label class="form-label" for="descricao">Descrição</label>
            <div class="textarea-wrapper">
              <textarea class="form-textarea" id="descricao" maxlength="500">
Palestra sobre os avanços recentes em IA generativa.</textarea
              >
              <span class="textarea-contador" id="contador">52/500</span>
            </div>
          </div>
        </div>

        <!-- Rodapé -->
        <footer class="modal-footer">
          <button class="btn-fechar-footer" type="button">Fechar</button>
          <button class="btn-salvar" type="button">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
            </svg>
            Editar evento
          </button>
        </footer>
      </div>
    </div>

    <script>
      const textarea = document.getElementById("descricao");
      const contador = document.getElementById("contador");
      function atualizarContador() {
        contador.textContent = `${textarea.value.length}/500`;
      }
      textarea.addEventListener("input", atualizarContador);
      atualizarContador();
    </script>
  </body>
</html>
