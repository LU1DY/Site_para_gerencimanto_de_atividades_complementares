<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <!-- SEO -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Painel acadêmico administrativo para gerenciamento de eventos, atividades, certificados e notificações."
    />
    <meta
      name="keywords"
      content="dashboard, gestão acadêmica, painel administrativo, sistema acadêmico"
    />
    <meta name="author" content="Luidy Michael" />

    <title>HorasComp | Gestão Acadêmica</title>

    <!-- Remix Icon -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../css/global-config.css" />
  </head>

  <body>
    <div class="layout">
      <!-- Sidebar -->
      <aside class="sidebar" aria-label="Menu lateral">
        <div class="sidebar__top">
          <!-- Logo -->
          <a href="#" class="logo" aria-label="Página inicial">
            <div class="logo__icon">
              <i class="ri-graduation-cap-line"></i>
            </div>

            <div class="logo__text">
              <strong>HorasComp</strong>
              <span>Gestão Acadêmica</span>
            </div>
          </a>

          <!-- Navegação -->
          <nav class="sidebar__nav">
            <ul class="menu">
              <li>
                <a href="#" class="menu__link menu__link--active">
                  <i class="ri-dashboard-line"></i>
                  <span>Dashboard</span>
                </a>
              </li>

              <li>
                <a href="#" class="menu__link">
                  <i class="ri-calendar-event-line"></i>
                  <span>Eventos</span>
                </a>
              </li>

              <li>
                <a href="#" class="menu__link">
                  <i class="ri-book-open-line"></i>
                  <span>Atividades</span>
                </a>
              </li>

              <li>
                <a href="#" class="menu__link">
                  <i class="ri-upload-cloud-line"></i>
                  <span>Certificados</span>
                </a>
              </li>

              <li>
                <a href="#" class="menu__link">
                  <i class="ri-notification-3-line"></i>
                  <span>Notificações</span>
                </a>
              </li>

              <li>
                <a href="#" class="menu__link">
                  <i class="ri-settings-3-line"></i>
                  <span>Admin</span>
                </a>
              </li>
            </ul>
          </nav>
        </div>

        <!-- Logout -->
        <div class="sidebar__bottom">
          <a href="#" class="menu__link">
            <i class="ri-logout-box-r-line"></i>
            <span>Sair</span>
          </a>
        </div>
      </aside>

      <!-- Conteúdo -->
      <div class="main-content">
        <!-- Header -->
        <header class="header">
          <div class="header__user">
            <div class="header__info">
              <strong>Maria Clara Santos</strong>
              <span>Ciências da Computação</span>
            </div>

            <div class="header__avatar" aria-label="Avatar do usuário">
              MC
            </div>
          </div>
        </header>

        <!-- Área principal -->
        <main class="content" aria-label="Conteúdo principal"></main>
      </div>
    </div>
  </body>
</html>
